<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <h1 class="bg-blue-300 m-2 block">display : block</h1>
    <h1 class="bg-green-300 m-2 w-1/3 inline-block">display : inline-block</h1>
    <h1 class="bg-red-300 m-2 w-40 inline">display : inline</h1>
    <h1 class="bg-yellow-300 m-2 w-40  lg:hidden">display : hidden</h1>
</body>
</html>
