<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <!-- justify-start -->
    <div class=" bg-gray-200 flex justify-start h-20">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">justify-start</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">justify-start</h1>
    </div>

    <!-- justify-end -->
    <div class=" bg-gray-300 flex justify-end h-20">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">justify-end</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">justify-end</h1>
    </div>

    <!-- justify-center -->
    <div class=" bg-gray-400 flex justify-center h-20">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">justify-center</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">justify-center</h1>
    </div>

    <!-- justify-between -->
    <div class=" bg-gray-500 flex justify-between h-20">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">justify-between</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">justify-between</h1>
    </div>

    <!-- justify-around -->
    <div class=" bg-gray-400 flex justify-around h-20">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">justify-around</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">justify-around</h1>
    </div>

    <!-- justify-evenly -->
    <div class=" bg-gray-300 flex justify-evenly h-20">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">justify-evenly</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">justify-evenly</h1>
    </div>

    <!-- flex-col : col direction default is row -->
    <div class=" bg-gray-200 flex flex-col h-28">
        <h1 class="bg-blue-300 m-2 p-2   w-32 ">flex-col</h1>
        <h1 class="bg-green-300 m-2  p-2  w-32">flex-col</h1>
    </div>
</body>
</html>
