<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typography</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <!-- Font Size  -->
    <p class="text-xs">Extra Small</p>
    <p class="text-sm">Small</p>
    <p class="text-base">Base (default)</p>
    <p class="text-lg">Large</p>
    <p class="text-xl">Extra Large</p>
    <p class="text-2xl">2XL</p>
    <p class="text-3xl">3XL</p>
<hr>    
    <!-- Font Weight -->
    <p class="font-thin">Thin</p>
    <p class="font-light">Light</p>
    <p class="font-normal">Normal</p>
    <p class="font-medium">Medium</p>
    <p class="font-semibold">Semi Bold</p>
    <p class="font-bold">Bold</p>
    <p class="font-extrabold">Extra Bold</p>
<hr>    
    <!-- Text Alignment -->
    <p class="text-left">Left</p>
<p class="text-center">Center</p>
<p class="text-right">Right</p>
<p class="text-justify">Justify</p>
<hr>    
<!-- Text Color -->
<p class="text-red-500">Red</p>
<p class="text-blue-600">Blue</p>
<p class="text-gray-700">Gray</p>
<hr>
<!-- Line Height (Leading) -->
<p class="leading-none">1</p>
<p class="leading-tight">Tight</p>
<p class="leading-normal">Normal</p>
<p class="leading-loose">Loose</p>
<hr>

<!-- Letter Spacing (Tracking) -->
 <p class="tracking-tight">Tight</p>
<p class="tracking-normal">Normal</p>
<p class="tracking-wide">Wide</p>
<hr>
<!-- Font Family -->
<p class="font-sans">Sans</p>
<p class="font-serif">Serif</p>
<p class="font-mono">Monospace</p>
<hr>
<!-- Text Decoration -->
 <p class="underline">Underline</p>
<p class="line-through">Line Through</p>
<p class="no-underline">No Underline</p>

</body>

</html>
