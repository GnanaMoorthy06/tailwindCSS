Padding Syntax
==============
p-4 => Adds padding on all sides 

pt-{size} → padding-top
pr-{size} → padding-right
pb-{size} → padding-bottom
pl-{size} → padding-left

px-{size} → left + right
py-{size} → top + bottom

Margin Syntax
=============

same as padding replace m instead p
