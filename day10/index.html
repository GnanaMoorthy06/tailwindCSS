<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Items</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <!-- items-start -->
    <div class=" bg-gray-200 flex items-start h-26">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">items-start</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">items-start</h1>
    </div>

    <!-- items-end -->
    <div class=" bg-gray-300 flex items-end h-26">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">items-end</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">items-end</h1>
    </div>

    <!-- items-center -->
    <div class=" bg-gray-400 flex items-center h-26">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">items-center</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">items-center</h1>
    </div>

    <!--items-stretch -->
    <div class=" bg-gray-300 flex items-stretch h-26">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">items-stretch</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">items-stretch</h1>
    </div>

    <!-- items-baseline-->
    <div class=" bg-gray-200 flex items-baseline h-26">
        <h1 class="bg-blue-300 m-2 p-2  w-32 ">items-baseline</h1>
        <h1 class="bg-green-300 m-2 p-2   w-32">items-baseline</h1>
    </div>
</body>
</html>
