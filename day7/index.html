<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body >

<!-- border -->
    <div class="border m-2">border</div>

    <!-- Border Width -->
    <div class="border m-1">Border Width</div>      <!-- 1px -->
<div class="border-2 m-1">Border Width</div>
<div class="border-4 m-1">Border Width</div>
<div class="border-8 m-1">Border Width</div>

<!-- Specific Sides -->
<div class="border-t m-1">top</div>  <!-- top -->
<div class="border-b m-1">bottom</div>  <!-- bottom -->
<div class="border-l m-1">left</div>  <!-- left -->
<div class="border-r mr-7">right</div>  <!-- right -->

<!-- Border Color -->
<div class="border border-red-500 m-1">Border Color</div>
<div class="border-2 border-blue-600 m-1">Border Color</div>
<div class="border-3 border-gray-300 m-1">Border Color</div>

<!-- Border Style -->
 <div class=" border-2 m-1">Border Style</div>
<div class="border-2 border-dotted m-1">Border Style</div>
<div class="border-2 border-solid m-1">Border Style</div>
<div class="border-2 border-double m-1">Border Style</div>
</div>

<!-- Radius Sizes -->
 <div class="rounded-sm m-3 border-2">Radius Sizes</div>
<div class="rounded m-3 border-2" >Radius Sizes</div>
<div class="rounded-md m-3 border-2">Radius Sizes</div>
<div class="rounded-lg m-3 border-2">Radius Sizes</div>
<div class="rounded-xl m-3 border-2">Radius Sizes</div>
<div class="rounded-2xl m-3 border-2">Radius Sizes</div>
<div class="rounded-3xl m-3 border-2">Radius Sizes</div>
<div class="rounded-full m-3 border-2">Radius Sizes</div>
</body>

</html>
